<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Background</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.5" stop-color="#0a1440"/>
      <stop offset="1" stop-color="#16308a"/>
    </linearGradient>
    <!-- Soft highlight from the top-left so the tile isn't flat -->
    <radialGradient id="hl" cx="0.28" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#8ab4ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8ab4ff" stop-opacity="0"/>
    </radialGradient>
    <!-- Faint glow around the white mark -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" values="0 0 0 0 0.54  0 0 0 0 0.7  0 0 0 0 1  0 0 0 0.55 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#hl)"/>
  <!-- Thin inner edge highlight -->
  <rect x="5" y="5" width="118" height="118" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <g filter="url(#glow)" fill="none" stroke="#ffffff" stroke-opacity="0.94" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="64" cy="64" r="38" stroke-width="9"/>
    <!-- Hands at 3:00 (a 10:10 V would read as a checkmark at small sizes) -->
    <path d="M64 64 V36 M64 64 H84" stroke-width="9"/>
  </g>
</svg>
